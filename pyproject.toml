[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmapss-rul"
version = "0.1.0"
description = "Remaining-useful-life prediction for turbofan engines (NASA C-MAPSS): pandas + PySpark features, gradient boosting and 1-D CNN models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eshagh Dehmollaian" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "torch>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
tracking = ["mlflow-skinny>=2.12"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cmapss-rul = "cmapss_rul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
